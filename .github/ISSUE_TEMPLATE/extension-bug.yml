name: Handshook extension bug
description: Report an extension problem using fictional details and reviewed diagnostics.
title: "[Extension] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Stop the run if an application or document looks wrong. Do not retry an uncertain submission.
        Never post passwords, keys, cookies, resumes, transcripts, full backups, application CSVs, or HAR files.
        Use fictional examples. Public issues and attached files may be visible to anyone.
        Check [known issues](https://github.com/Prakashmaheshwaran/handshook-extension/blob/master/extension/docs/KNOWN_ISSUES.md) first.
  - type: input
    id: versions
    attributes:
      label: Extension, browser, and OS versions
      placeholder: Handshook 1.1.4, Chrome version, macOS or Windows version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options:
        - Review
        - Dry run
        - Autopilot with Review before submit on
        - Autopilot with Review before submit off
        - Setup or no active run
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, and actual result
      description: Include the visible error code and install method. Omit account, school, job, and document identifiers.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional reviewed diagnostics or screenshot
      description: |
        Export shareable diagnostics from Settings → Diagnostics. In 1.1.4 this includes only status codes,
        settings flags, counters, and selector keys; names, searches/URLs, answers, event text, and credentials
        are excluded. Review the file before attaching it, especially from an older version; remove any
        personal data or credentials. If unsure, leave attachments out; a written report is sufficient.
        Never attach Export private backup: it contains your searches, answers, documents, and history.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and attachments and removed personal data and credentials.
          required: true
