name: Known issues

# Lists every extension bug report in extension/docs/KNOWN_ISSUES.md
# ("Reported by users") and keeps its Open/Closed status current.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: known-issues
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'bug') || github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/known-issues.cjs');
            await run({ github, context, core });
